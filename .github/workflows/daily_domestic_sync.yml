name: Daily Domestic Sync to D1

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  domestic-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 requests
          # 🌟 自动在 Linux 容器中安装轻量无头浏览器及其系统依赖 [3]
          playwright install --with-deps chromium

      - name: Execute Domestic Sync to D1
        env:
          CF_WORKER_DOMESTIC_API: ${{ secrets.CF_WORKER_DOMESTIC_API }}
          CF_SECRET_TOKEN: ${{ secrets.CF_SECRET_TOKEN }}
        run: |
          python daily_sync_domestic.py
