name: Daily Domestic Sync to D1 (Free FlareSolverr)

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  domestic-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi beautifulsoup4 requests

      - name: Start FlareSolverr Service (Free CF Bypass)
        # 🌟 在 GitHub 虚拟机后台拉起开源过盾神器
        run: |
          docker run -d \
            --name flaresolverr \
            -p 8191:8191 \
            -e LOG_LEVEL=info \
            ghcr.io/flaresolverr/flaresolverr:latest
          
          # 等待 60 秒让 FlareSolverr 容器完全启动初始化
          echo "Waiting for FlareSolverr to start..."
          sleep 60

      - name: Execute Domestic Sync to D1
        env:
          CF_WORKER_DOMESTIC_API: ${{ secrets.CF_WORKER_DOMESTIC_API }}
          CF_SECRET_TOKEN: ${{ secrets.CF_SECRET_TOKEN }}
        run: |
          python daily_sync_domestic.py
