name: Daily Domestic Sync to D1

on:
  schedule:
    # 🌟 每天北京时间 15:00 自动运行一次
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  domestic-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi beautifulsoup4 requests

      - name: Execute Domestic Sync to D1
        env:
          # 🌟 对应你在国产区仓库 Secrets 中配置的变量
          CF_WORKER_DOMESTIC_API: ${{ secrets.CF_WORKER_DOMESTIC_API }}
          CF_SECRET_TOKEN: ${{ secrets.CF_SECRET_TOKEN }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          python daily_sync_domestic.py
